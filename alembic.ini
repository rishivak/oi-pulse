# Alembic configuration. The URL is supplied from DATABASE_URL at runtime
# (oipulse/migrations/env.py) and is deliberately absent here so a credential
# never lands in version control.
[alembic]
script_location = oipulse/migrations

# TWO version locations, ONE chain, ONE alembic_version table.
#
# The live database already carries `alembic_version = '002'` from the legacy
# backend/alembic chain (001 -> 002). The v2 chain continues from that head rather
# than starting a second root: a second root in the same version table makes
# `alembic upgrade head` fail with "Can't locate revision identified by '002'",
# and resolving it by hand-editing alembic_version would silently disown the legacy
# schema.
#
# Consequences, all intended:
#   * existing database  -> 002 -> 0001_phase1_sys_tables -> 0002_phase2_market_data
#   * fresh database     -> 001 -> 002 -> 0001 -> 0002, i.e. identical to production
#   * legacy tables are neither dropped nor truncated; AD-20 keeps the legacy app
#     running until cutover, so its schema must still exist.
#   * no ambiguous parallel chain: `alembic heads` reports exactly one head.
#
# After cutover, legacy tables are removed by a new forward migration, never by
# deleting history.
version_locations = oipulse/migrations/versions backend/alembic/versions
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
