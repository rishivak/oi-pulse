# OI Pulse v2 — CI
#
# The Phase 1 gate (docs/design/20-ARCHITECTURE_FREEZE.md §9): "boundaries + clock
# enforced in CI". The `gate` job below is that enforcement and is a required check.
#
# The gate deliberately needs NO third-party package. The guards are stdlib-only AST
# scans, so the boundary contract cannot be disabled by a dependency problem, a resolver
# failure or an offline runner. `18-ROADMAP.md` Phase 1 acceptance: "CI fails on a
# boundary violation or a `datetime.now()` call."

name: ci

on:
  push:
    branches: [main, "phase*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Phase gate (architectural invariants)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No `pip install` above this line, and that is the point: the architectural
      # guards run on a bare interpreter.
      - name: No wall-clock access outside core.clock
        run: python tools/check_clock_access.py oipulse

      - name: Layer boundaries and dependency direction
        run: python tools/check_import_boundaries.py

      - name: No unbounded repository reads
        run: python tools/check_temporal_repository.py oipulse

      - name: Single alembic chain, one head
        run: python tools/check_migration_chain.py

      - name: Schema parity (observation kinds <-> tables <-> migrations)
        run: python tools/check_schema_parity.py

      # PostgreSQL ordering: parent table -> constraints -> partitions -> indexes.
      # External verification found migration 0002 partitioning `obs_depth` before
      # creating it; nothing in CI would have caught it.
      - name: Migration operation ordering
        run: python tools/check_migration_order.py

      # A stdlib subset of `mypy --strict`, so the strict-typing contract is still
      # enforced on a runner with no package index. The `typecheck` job below runs
      # real mypy and remains authoritative.
      - name: Strict-typing subset (stdlib approximation)
        run: python tools/check_typing_strict.py

      # Phase 5. Delivery must not be able to write back to a signal: if it could,
      # every later query over signals would silently become a query over *delivered*
      # signals, and the undelivered ones would vanish from analysis.
      - name: Alerts cannot mutate signal truth
        run: python tools/check_alert_purity.py

      # Phase 12. The terminal is a presentation layer over the verified contracts.
      # The first guard regenerates the API contract from oipulse/api/*.py and fails
      # on drift or on any frontend path, screen declaration or DTO field the backend
      # does not actually serve -- 18-ROADMAP.md Phase 12's "no screen ships ahead of
      # its backend", checked rather than asserted.
      - name: Generated API contract is current
        run: python tools/export_api_contract.py --check

      - name: Frontend calls correspond to backend contracts
        run: python tools/check_frontend_contract.py

      # No database, provider, broker, secret or stream reachable from the terminal,
      # no live-execution path, no analytics recomputed client-side.
      - name: Terminal boundary
        run: python tools/check_terminal_boundary.py

      # Resolves every import and named export in the terminal tree. It stands in
      # for the part of `tsc` that catches a mistyped path or a renamed export, so
      # that class of error is caught on a bare interpreter rather than only in the
      # `frontend` job below. It is not a type check and does not replace one.
      - name: Terminal imports resolve
        run: python tools/check_terminal_imports.py

      # Phase 12 remediation. Every route carries an authorization policy or is one
      # of the two container probes; the five permissions are 17-SECURITY.md §4's;
      # no route requires LIVE_TRADE; CSRF covers every state-changing method.
      - name: Authorization boundary
        run: python tools/check_auth_boundary.py

      # Resolves every `from oipulse....` name against the module it names. Added
      # after an import of a function that did not exist reached this far: the
      # module needed fastapi to import, so nothing local executed it, and
      # compileall compiles without resolving names.
      - name: Internal imports resolve
        run: python tools/check_internal_imports.py

      - name: Foundation tests (stdlib only)
        run: python -m unittest discover -s tests -t . -v

  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.5
      - run: ruff check oipulse tools tests
      - run: ruff format --check oipulse tools tests

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    # Required. It was advisory during Phase 1 and that hid real errors; strict mypy
    # now blocks the merge. mypy 1.13 is the floor because PEP 695 type parameters
    # (`class Foo[T]`) — which ruff UP046 requires on py312 — cannot be parsed by 1.11.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: mypy

  contracts:
    name: Import-linter contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Installed with the package: import-linter resolves every module it names
      # against the real import graph, so the package must be importable.
      - run: pip install -e ".[dev]"
      # Redundant with tools/check_import_boundaries.py by design: the stdlib guard
      # cannot be skipped, import-linter gives richer layering analysis. The boundary
      # contract is the one thing that must not be silently disabled.
      - run: lint-imports

  migrations:
    name: Migrations against real PostgreSQL
    runs-on: ubuntu-latest
    # The structural migration tests run in the `gate` job with no database. This job
    # is the other half: it applies the chain to a real PostgreSQL and introspects the
    # result. `tests/integration/` skips without DATABASE_URL, so without this job the
    # migration would again be unverified against an actual server.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oipulse
          POSTGRES_PASSWORD: oipulse
          POSTGRES_DB: oipulse_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oipulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://oipulse:oipulse@localhost:5432/oipulse_ci
      OIPULSE_PARTITION_ANCHOR: "2026-01-01"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # A skip here would mean the database was unreachable, and a skipped migration
      # suite must not read as a pass -- that is precisely how the chain reached
      # external verification unapplied. `-p no:randomly --strict-markers` keeps the
      # run deterministic; the grep turns any skip into a failure.
      - name: Apply the chain to PostgreSQL (must not skip)
        run: |
          set -o pipefail
          pytest -q tests/integration/test_migrations_postgres.py -rs 2>&1 | tee out.txt
          if grep -qi "skipped" out.txt; then
            echo "::error::migration integration tests skipped; they must run in CI"
            exit 1
          fi

  frontend:
    name: Terminal (build, types, lint, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # The terminal's pure modules run under `node --test` with Node's native
      # TypeScript stripping and no test framework. This step needs no dependencies
      # and is the one that covers the temporal, quality, residual and
      # no-live-trading decisions.
      - run: npm test
      - run: npm run type-check
      - run: npm run lint
      # A production build is the only check that the route tree, the server/client
      # component split and module resolution actually hold together.
      - run: npm run build
        env:
          OIPULSE_V2_API_URL: http://localhost:8001

  tests:
    name: Full suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
