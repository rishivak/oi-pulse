[project]
name = "oipulse"
version = "2.0.0a1"
description = "OI Pulse v2 — options market intelligence, research and trading platform"
requires-python = ">=3.12"

# Phase 1 runtime dependencies. Deliberately short: oipulse.core is stdlib-only
# (AD-28), so nothing here is needed to import or test the foundation layer.
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.6",
  "sqlalchemy==2.0.35",
  "asyncpg==0.29.0",
  "alembic==1.13.3",
  "redis[hiredis]==5.0.8",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.3",
  "pytest-asyncio==0.24.0",
  "ruff==0.16.5",
  # >=1.12 for PEP 695 type parameters (`class Foo[T]`), which ruff UP046
  # requires on py312 and which 1.11 cannot parse.
  "mypy==1.13.0",
  "import-linter==2.1",
]

[tool.setuptools.packages.find]
include = ["oipulse*"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Phase 1 tests are unittest.TestCase so they run under `python -m unittest` with no
# third-party package installed. pytest collects them natively.
python_files = ["test_*.py"]

# ------------------------------------------------------------------ ruff
[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
  "backend",
  "frontend",
  ".venv",
  "oipulse/migrations/versions",
  "oipulse/marketdata/providers/upstox/proto/MarketDataFeed_pb2.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
  "E501",    # line length is handled by the formatter
  "B008",    # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # sys.path bootstrap must precede imports

# ------------------------------------------------------------------ mypy
[tool.mypy]
python_version = "3.12"
packages = ["oipulse"]
strict = true
warn_unreachable = true
# Migrations are Alembic-generated shapes with op.* calls that carry no useful types,
# and they are validated by tools/check_migration_chain.py and check_schema_parity.py
# instead.
exclude = ["oipulse/migrations/"]

[[tool.mypy.overrides]]
# Third-party packages without bundled stubs. Listed individually rather than with a
# global ignore_missing_imports, so a genuinely missing internal module still errors.
module = ["alembic.*", "uvicorn.*", "websockets.*"]
ignore_missing_imports = true

# --------------------------------------------------------- import-linter
# Internal layering only.
#
# Third-party bans (`core` must not import sqlalchemy/pydantic, `analytics` must not
# import a DB driver or HTTP client) are enforced by tools/check_import_boundaries.py
# rather than here: import-linter has to build a grimp graph of every module it names,
# so forbidding external packages means importing and walking them, which is slow and
# fails outright when the package is absent. The stdlib guard needs no install, so the
# boundary contract cannot be disabled by a dependency problem — which is the property
# that matters most for the rule that keeps the architecture honest.
[tool.importlinter]
root_package = "oipulse"
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "Dependencies point downward only"
type = "layers"
exhaustive = false
# Verified against the actual import graph, not aspiration:
#   run -> api, core, observability
#   api -> core, marketstate, observability
#   marketstate -> core, dataquality, instruments, marketdata, observability
#   marketdata -> core, dataquality, instruments, observability, persistence
#   dataquality | events | instruments | observability | persistence -> core
# `marketstate` (Phase 3, L3) sits above `marketdata` because it reads observations and
# never the reverse: the ingestion layer must not depend on state assembly, or a WS
# consumer would block on it.
layers = [
    "oipulse.run",
    "oipulse.api",
    "oipulse.marketstate",
    "oipulse.marketdata",
    "oipulse.dataquality : oipulse.events : oipulse.instruments : oipulse.observability : oipulse.persistence",
    "oipulse.core",
]

[[tool.importlinter.contracts]]
name = "core depends on nothing internal"
type = "forbidden"
source_modules = ["oipulse.core"]
forbidden_modules = [
    "oipulse.api",
    "oipulse.dataquality",
    "oipulse.events",
    "oipulse.instruments",
    "oipulse.marketdata",
    "oipulse.marketstate",
    "oipulse.observability",
    "oipulse.persistence",
    "oipulse.run",
]

# NOTE: there is deliberately no import-linter contract for `oipulse.analytics`.
# import-linter resolves every module it names against the real import graph and errors
# out when one is absent, so a contract for a package that arrives in Phase 4 would make
# `lint-imports` fail today. The analytics purity rule is armed *now* in
# tools/check_import_boundaries.py, which is AST-based and does not require the package
# to exist — so the rule is live before the code it governs, which is the point of
# arming contracts early. Phase 4 adds the matching import-linter contract alongside the
# package.
